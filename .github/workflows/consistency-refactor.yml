name: Consistency refactor

on:
  push:
    paths:
      - '.github/workflows/consistency-refactor.yml'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Refactor repeated UI to shared components
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'missing expected block: {label}')
              return text.replace(old, new, 1)

          # Home: shared NewsCard is the source of truth for every story card.
          path = 'src/pages/index.astro'
          text = read(path)
          text = replace_once(text,
              "import BaseLayout from '../layouts/BaseLayout.astro';\nimport news from '../../data/news.json';\nimport { sourceLogoPath } from '../lib/sourceLogos';\nimport { collapseTimelineStories } from '../lib/timelineStories';",
              "import BaseLayout from '../layouts/BaseLayout.astro';\nimport NewsCard from '../components/NewsCard.astro';\nimport news from '../../data/news.json';\nimport { collapseTimelineStories } from '../lib/timelineStories';",
              'home imports')
          text = re.sub(r"\nconst storyHref = .*?\nconst published = \(value\) => \{.*?\n\};\n", "\n", text, count=1, flags=re.S)
          text = text.replace('  <link rel="stylesheet" href={`${base}card-refinements.css`} />\n\n', '', 1)
          pattern = re.compile(r"\s*return \(\n\s*<a\n\s*class:list=\{\[\"news-card\", \"searchable\", index < 3 \? \"card-featured\" : \"card-standard\".*?</a>\n\s*\);", re.S)
          replacement = '''\n              return (\n                <NewsCard\n                  story={story}\n                  index={index}\n                  variant={index < 3 ? 'featured' : 'standard'}\n                  searchable={true}\n                  dateGroup={group.key}\n                  dataSearch={`${story.title} ${story.summary || ''} ${(story.cluster_sources || [story.source]).join(' ')} ${story.category || ''}`.toLowerCase()}\n                />\n              );'''
          text, n = pattern.subn(replacement, text, count=1)
          if n != 1:
              raise SystemExit('home NewsCard block not replaced')
          write(path, text)

          # Latest: same NewsCard and shared PageHeading.
          path = 'src/pages/latest/index.astro'
          text = read(path)
          text = replace_once(text,
              "import BaseLayout from '../../layouts/BaseLayout.astro';\nimport news from '../../../data/news.json';\nimport { sourceLogoPath } from '../../lib/sourceLogos';\nimport { collapseTimelineStories } from '../../lib/timelineStories';",
              "import BaseLayout from '../../layouts/BaseLayout.astro';\nimport NewsCard from '../../components/NewsCard.astro';\nimport PageHeading from '../../components/PageHeading.astro';\nimport news from '../../../data/news.json';\nimport { collapseTimelineStories } from '../../lib/timelineStories';",
              'latest imports')
          text = re.sub(r"\nconst storyHref = .*?\nconst published = \(value\) => \{.*?\n\};\n", "\n", text, count=1, flags=re.S)
          text = text.replace('  <link rel="stylesheet" href={`${base}card-refinements.css`} />\n\n', '', 1)
          text = replace_once(text,
              '''    <section class="latest-page-heading shell">\n      <p class="masthead-label">Chronological</p>\n      <h1>Latest</h1>\n      <p>Every local story event, newest first.</p>\n    </section>''',
              '''    <section class="latest-page-heading shell">\n      <PageHeading eyebrow="Chronological" title="Latest" description="Every local story event, newest first." />\n    </section>''',
              'latest heading')
          pattern = re.compile(r"\s*return \(\n\s*<a\n\s*class:list=\{\[\"news-card\", \"card-standard\", \"searchable\".*?</a>\n\s*\);", re.S)
          replacement = '''\n              return (\n                <NewsCard\n                  story={story}\n                  index={index}\n                  variant="standard"\n                  searchable={true}\n                  dateGroup={group.key}\n                  dataSearch={`${story.title} ${story.summary || ''} ${(story.cluster_sources || [story.source]).join(' ')} ${story.category || ''}`.toLowerCase()}\n                />\n              );'''
          text, n = pattern.subn(replacement, text, count=1)
          if n != 1:
              raise SystemExit('latest NewsCard block not replaced')
          write(path, text)

          # Search: results use the exact Home standard card.
          path = 'src/pages/search/index.astro'
          text = read(path)
          text = replace_once(text,
              "import BaseLayout from '../../layouts/BaseLayout.astro';\nimport news from '../../../data/news.json';\nimport { sourceLogoPath } from '../../lib/sourceLogos';",
              "import BaseLayout from '../../layouts/BaseLayout.astro';\nimport NewsCard from '../../components/NewsCard.astro';\nimport PageHeading from '../../components/PageHeading.astro';\nimport news from '../../../data/news.json';",
              'search imports')
          text = re.sub(r"\nconst logoFor = .*?\nconst published = .*?;\n", "\n", text, count=1, flags=re.S)
          text = replace_once(text,
              '''      <header class="directory-heading">\n        <p class="masthead-label">Find stories</p>\n        <h1>Search</h1>\n        <p>Search headlines, publishers, locations and article text from the current London News archive.</p>\n      </header>''',
              '''      <PageHeading className="directory-heading" eyebrow="Find stories" title="Search" description="Search headlines, publishers, locations and article text from the current London News archive." />''',
              'search heading')
          old = '''        {stories.map((story) => (\n          <a class="search-result-card" href={`${base}story/${story.id}/`} data-story-id={story.id} data-source={story.source} hidden>\n            {story.image && <div class="search-result-media"><img class="search-result-photo" src={story.card_image ? `${base}${story.card_image}` : story.image} alt={story.image_alt || ''} loading="lazy" referrerpolicy="no-referrer" />{logoFor(story.source) && <img class="card-source-logo" onerror="this.style.display='none'" src={logoFor(story.source)} alt="" loading="lazy" />}</div>}\n            <div class="search-result-copy">\n              <span>{story.source}</span>\n              <h2>{story.title}</h2>\n              <time datetime={story.cluster_latest_published || story.published}>{published(story.cluster_latest_published || story.published)}</time>\n            </div>\n          </a>\n        ))}'''
          new = '''        {stories.map((story) => (\n          <NewsCard story={story} variant="standard" hidden={true} className="search-result-item" />\n        ))}'''
          text = replace_once(text, old, new, 'search cards')
          text = text.replace("document.querySelectorAll('.search-result-card')", "document.querySelectorAll('.search-result-item')")
          write(path, text)

          # Sections: shared page heading.
          path = 'src/pages/sections/index.astro'
          text = read(path)
          text = replace_once(text,
              "import BaseLayout from '../../layouts/BaseLayout.astro';\nimport news from '../../../data/news.json';",
              "import BaseLayout from '../../layouts/BaseLayout.astro';\nimport PageHeading from '../../components/PageHeading.astro';\nimport news from '../../../data/news.json';",
              'sections imports')
          text = replace_once(text,
              '''      <header class="sections-heading">\n        <p class="masthead-label">Browse</p>\n        <h1>Sections</h1>\n        <p>Choose a section to see its newest stories first.</p>\n      </header>''',
              '''      <PageHeading className="sections-heading" eyebrow="Browse" title="Sections" description="Choose a section to see its newest stories first." />''',
              'sections heading')
          write(path, text)

          # Sources: same page heading, preserving its action controls.
          path = 'src/pages/sources/index.astro'
          text = read(path)
          text = replace_once(text,
              "import BaseLayout from '../../layouts/BaseLayout.astro';\nimport news from '../../../data/news.json';",
              "import BaseLayout from '../../layouts/BaseLayout.astro';\nimport PageHeading from '../../components/PageHeading.astro';\nimport news from '../../../data/news.json';",
              'sources imports')
          old = '''      <header class="sources-heading">\n        <div>\n          <p class="masthead-label">Your feed</p>\n          <h1>Sources</h1>\n          <p>Choose which publishers and local organizations appear in London News. Your choices are saved on this device.</p>\n        </div>\n        <div class="sources-heading-actions">\n          <span id="sourcePreferenceStatus" aria-live="polite">{sources.length} sources shown</span>\n          <button class="bordered-button" id="showAllSources" type="button">Show all</button>\n        </div>\n      </header>'''
          new = '''      <PageHeading className="sources-heading" eyebrow="Your feed" title="Sources" description="Choose which publishers and local organizations appear in London News. Your choices are saved on this device.">\n        <div slot="actions" class="sources-heading-actions">\n          <span id="sourcePreferenceStatus" aria-live="polite">{sources.length} sources shown</span>\n          <button class="bordered-button" id="showAllSources" type="button">Show all</button>\n        </div>\n      </PageHeading>'''
          text = replace_once(text, old, new, 'sources heading')
          write(path, text)

          # Settings: shared page heading.
          path = 'src/pages/settings/index.astro'
          text = read(path)
          text = replace_once(text,
              "import BaseLayout from '../../layouts/BaseLayout.astro';",
              "import BaseLayout from '../../layouts/BaseLayout.astro';\nimport PageHeading from '../../components/PageHeading.astro';",
              'settings imports')
          text = replace_once(text,
              '''      <header class="settings-heading directory-heading">\n        <p class="masthead-label">Preferences</p>\n        <h1>Settings</h1>\n        <p>Choose how London News looks and how stories behave on this device.</p>\n      </header>''',
              '''      <PageHeading className="settings-heading directory-heading" eyebrow="Preferences" title="Settings" description="Choose how London News looks and how stories behave on this device." />''',
              'settings heading')
          write(path, text)

          # Article recommendations: use the same Home standard NewsCard.
          path = 'src/pages/story/[id].astro'
          text = read(path)
          text = replace_once(text,
              "import BaseLayout from '../../layouts/BaseLayout.astro';\nimport { sourceLogoPath } from '../../lib/sourceLogos';",
              "import BaseLayout from '../../layouts/BaseLayout.astro';\nimport NewsCard from '../../components/NewsCard.astro';\nimport { sourceLogoPath } from '../../lib/sourceLogos';",
              'story imports')
          text = re.sub(r"\nconst compactPublished = \(value\) => \{.*?\n\};\n", "\n", text, count=1, flags=re.S)
          start = text.find('            {related.map((item) => {')
          if start < 0:
              raise SystemExit('related cards start not found')
          end_marker = '            })}\n'
          end = text.find(end_marker, start)
          if end < 0:
              raise SystemExit('related cards end not found')
          end += len(end_marker)
          text = text[:start] + '            {related.map((item) => <NewsCard story={item} variant="standard" />)}\n' + text[end:]
          write(path, text)
          PY
      - name: Commit consistency refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages
          git diff --cached --quiet && exit 0
          git commit -m "Unify repeated UI with shared components"
          git push origin main
