name: Probe London Police article markup

on:
  push:
    paths:
      - '.github/workflows/lps-probe.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Install parser
        run: pip install beautifulsoup4

      - name: Inspect Cole Rioux article
        shell: bash
        run: |
          set -euo pipefail
          article='https://www.londonpolice.ca/news/posts/missing-person-cole-rioux/'
          curl -L --connect-timeout 5 --max-time 25 -sS "$article" -o /tmp/lps-article.html
          echo "article bytes=$(wc -c < /tmp/lps-article.html)"
          python3 - <<'PY'
          from bs4 import BeautifulSoup
          html=open('/tmp/lps-article.html',encoding='utf-8').read()
          soup=BeautifulSoup(html,'html.parser')
          print('TITLE:', soup.title.get_text(' ',strip=True) if soup.title else '')
          print('OG IMAGE:', (soup.find('meta',property='og:image') or {}).get('content',''))
          print('TW IMAGE:', (soup.find('meta',attrs={'name':'twitter:image'}) or {}).get('content',''))
          print('ARTICLE ROOTS:')
          sels=['.news-article-content','.news-post-content','.news-post__content','.field--name-body','.article-content','[itemprop="articleBody"]','article','main']
          for sel in sels:
              nodes=soup.select(sel)
              if nodes:
                  print(sel, len(nodes), [len(n.get_text(' ',strip=True)) for n in nodes[:3]], 'imgs=', [len(n.select('img')) for n in nodes[:3]])
          print('IMAGES:')
          for i,img in enumerate(soup.find_all('img')[:60]):
              print(i, 'src=',img.get('src'), 'data-src=',img.get('data-src'), 'data-srcset=',img.get('data-srcset'), 'srcset=',img.get('srcset'), 'alt=',img.get('alt'), 'width=',img.get('width'), 'height=',img.get('height'), 'class=',img.get('class'), 'parent=',img.parent.name, img.parent.get('class') if img.parent else None)
          print('HEADINGS/TEXT:')
          for node in soup.find_all(['h1','h2','h3','p'])[:80]:
              text=' '.join(node.stripped_strings)
              if text: print(node.name, node.get('class'), repr(text[:240]))
          PY
