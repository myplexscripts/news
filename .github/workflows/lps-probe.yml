name: Probe London Police article markup

on:
  push:
    paths:
      - '.github/workflows/lps-probe.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install parser dependencies
        run: pip install requests beautifulsoup4

      - name: Run London Police normalizer
        run: python scripts/fix_lps_articles.py

      - name: Verify Cole Rioux story
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          payload=json.loads(Path('data/news.json').read_text(encoding='utf-8'))
          police=[s for s in payload.get('stories',[]) if s.get('source')=='London Police Service']
          with_images=sum(1 for s in police if s.get('image'))
          normalized=sum(1 for s in police if s.get('lps_article_schema')==1)
          taxonomy=[]
          for story in police:
              for block in story.get('content_blocks') or []:
                  if isinstance(block,dict) and str(block.get('text','')).strip().lower() in {'general releases','all categories'}:
                      taxonomy.append((story.get('title'),block.get('text')))
          print(f'police stories={len(police)} normalized={normalized} with_images={with_images} taxonomy_leaks={len(taxonomy)}')
          cole=next((s for s in police if 'cole rioux' in str(s.get('title','')).lower() or 'cole-rioux' in str(s.get('url','')).lower()),None)
          if not cole:
              raise SystemExit('Cole Rioux story not found in current data')
          print('COLE TITLE:',cole.get('title'))
          print('COLE IMAGE:',cole.get('image'))
          print('COLE STATUS:',cole.get('content_status'),'words=',cole.get('word_count'))
          print('COLE BLOCKS:',[(b.get('type'),b.get('text') or b.get('url')) for b in (cole.get('content_blocks') or [])[:8]])
          assert cole.get('image'), 'Cole story still has no image'
          assert 'govstack.com' in cole.get('image',''), 'Cole story is not using publisher image'
          assert not any(str(b.get('text','')).strip().lower() in {'general releases','all categories'} for b in cole.get('content_blocks') or [] if isinstance(b,dict)), 'taxonomy still leaked into Cole story'
          PY
