name: Article reader tests

on:
  push:
    branches: [main]
    paths:
      - 'requirements.txt'
      - 'scripts/enrich_rich_articles.py'
      - 'scripts/test_rich_articles.py'
      - 'scripts/sanitize_article_blocks.py'
      - 'scripts/test_final_article_guard.py'
      - 'scripts/test_article_boundaries.py'
      - 'scripts/merge_refresh_output.py'
      - 'scripts/test_refresh_merge.py'
      - 'scripts/reader_mode_articles.py'
      - 'scripts/test_reader_mode_articles.py'
      - 'scripts/cleanup_article_recirculation.py'
      - 'scripts/test_recirculation_cleanup.py'
      - 'scripts/article_source_profiles.py'
      - 'scripts/test_source_profiles.py'
      - '.github/workflows/article-reader-tests.yml'
  pull_request:
    paths:
      - 'requirements.txt'
      - 'scripts/enrich_rich_articles.py'
      - 'scripts/test_rich_articles.py'
      - 'scripts/sanitize_article_blocks.py'
      - 'scripts/test_final_article_guard.py'
      - 'scripts/test_article_boundaries.py'
      - 'scripts/merge_refresh_output.py'
      - 'scripts/test_refresh_merge.py'
      - 'scripts/reader_mode_articles.py'
      - 'scripts/test_reader_mode_articles.py'
      - 'scripts/cleanup_article_recirculation.py'
      - 'scripts/test_recirculation_cleanup.py'
      - 'scripts/article_source_profiles.py'
      - 'scripts/test_source_profiles.py'
      - '.github/workflows/article-reader-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reader-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install extractor dependencies
        run: pip install -r requirements.txt

      - name: Test rich article reconstruction
        run: python scripts/test_rich_articles.py

      - name: Test source article profiles
        run: python scripts/test_source_profiles.py

      - name: Test global article boundaries
        run: python scripts/test_article_boundaries.py

      - name: Test final rich article guard
        run: python scripts/test_final_article_guard.py

      - name: Test refresh merge protection
        run: python scripts/test_refresh_merge.py

      - name: Test reader-mode extraction
        run: python scripts/test_reader_mode_articles.py

      - name: Test contextual article cleanup
        run: python scripts/test_recirculation_cleanup.py

      - name: Compile article extractors
        run: python -m py_compile scripts/enrich_rich_articles.py scripts/sanitize_article_blocks.py scripts/merge_refresh_output.py scripts/reader_mode_articles.py scripts/cleanup_article_recirculation.py scripts/article_source_profiles.py
