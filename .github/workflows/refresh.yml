name: Refresh local news

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'requirements.txt'
      - '.github/workflows/refresh.yml'
      - '.github/workflows/refresh-wake.yml'
  workflow_dispatch:
  schedule:
    # Backup watchdog only. A separate wake workflow normally starts each cycle.
    - cron: '7,17,27,37,47,57 * * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: refresh-local-news-v2
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Record refresh cycle start
        shell: bash
        run: echo "CYCLE_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"

      - name: Decide whether refresh is due
        id: due
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Non-scheduled run: refresh required."
            exit 0
          fi

          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          due = True
          try:
              payload = json.loads(Path("data/news.json").read_text(encoding="utf-8"))
              raw = str(payload.get("generated_at") or "").strip().replace("Z", "+00:00")
              generated = datetime.fromisoformat(raw)
              if generated.tzinfo is None:
                  generated = generated.replace(tzinfo=timezone.utc)
              generated = generated.astimezone(timezone.utc)
              age_minutes = (datetime.now(timezone.utc) - generated).total_seconds() / 60
              due = age_minutes >= 20
              print(f"Published feed age: {age_minutes:.1f} minutes. Refresh due: {due}")
          except Exception as exc:
              print(f"Could not verify feed freshness, refreshing safely: {exc}")
              due = True

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"run={'true' if due else 'false'}\n")
          PY

      - name: Set up Python
        if: steps.due.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install collector dependencies
        if: steps.due.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Validate refresh workflow
        if: steps.due.outputs.run == 'true'
        run: python scripts/test_workflow_config.py

      - name: Test Scoop runtime safeguards
        if: steps.due.outputs.run == 'true'
        run: python scripts/test_scoop_runtime.py

      - name: Test publication roundup filters
        if: steps.due.outputs.run == 'true'
        run: python scripts/test_publication_roundups.py

      - name: Test article recirculation cleanup
        if: steps.due.outputs.run == 'true'
        run: python scripts/test_recirculation_cleanup.py

      - name: Test inline article formatting
        if: steps.due.outputs.run == 'true'
        run: python scripts/test_article_formatting.py

      - name: Test article media preservation
        if: steps.due.outputs.run == 'true'
        run: python scripts/test_article_media.py

      - name: Test source specific article profiles
        if: steps.due.outputs.run == 'true'
        run: python scripts/test_source_profiles.py

      - name: Fetch local news
        if: steps.due.outputs.run == 'true'
        run: python scripts/run_scoop.py

      - name: Remove redundant publisher roundups
        if: steps.due.outputs.run == 'true'
        run: python scripts/filter_publication_roundups.py

      - name: Normalize London Police articles
        if: steps.due.outputs.run == 'true'
        run: python scripts/fix_lps_articles.py

      - name: Normalize CBC fallback metadata
        if: steps.due.outputs.run == 'true'
        run: python scripts/fix_cbc_fallback.py

      - name: Hydrate CBC article bodies from Lite
        if: steps.due.outputs.run == 'true'
        run: python scripts/hydrate_cbc_lite.py

      - name: Repair CBC image references
        if: steps.due.outputs.run == 'true'
        run: python scripts/repair_cbc_image_refs.py

      - name: Preserve source article structure
        if: steps.due.outputs.run == 'true'
        run: python scripts/enrich_article_structure.py

      - name: Preserve inline article formatting
        if: steps.due.outputs.run == 'true'
        run: python scripts/refine_article_formatting.py

      - name: Apply source specific extraction profiles
        if: steps.due.outputs.run == 'true'
        run: python scripts/refine_source_articles.py

      - name: Remove inline promoted-story modules
        if: steps.due.outputs.run == 'true'
        run: python scripts/cleanup_article_recirculation.py

      - name: Preserve article audio and video
        if: steps.due.outputs.run == 'true'
        run: python scripts/enrich_article_media.py

      - name: Cache CBC article images locally
        if: steps.due.outputs.run == 'true'
        run: python scripts/cache_cbc_images.py

      - name: Run Scoop regression tests
        if: steps.due.outputs.run == 'true'
        run: python scripts/test_scraper_regressions.py

      - name: Run editorial intelligence tests
        if: steps.due.outputs.run == 'true'
        run: python scripts/test_editorial.py

      - name: Run audit rule tests
        if: steps.due.outputs.run == 'true'
        run: |
          python scripts/test_audit.py
          python scripts/test_run_audit.py

      - name: Audit current Scoop output
        if: steps.due.outputs.run == 'true'
        run: python scripts/run_audit.py --sample-per-source 10

      - name: Upload Scoop audit report
        if: steps.due.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: scoop-audit-report
          path: data/audit.json
          retention-days: 14

      - name: Commit refreshed news
        id: commit
        if: steps.due.outputs.run == 'true'
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- data/news.json data/audit.json public/cache/)" ]; then
            echo "No data changes"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json data/audit.json public/cache/
          git commit -m "Refresh local news"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Deploy refreshed site
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run site.yml --ref main

      - name: Schedule next refresh
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          now=$(date +%s)
          elapsed=$((now - CYCLE_START_EPOCH))
          wait_seconds=$((900 - elapsed))
          if [ "$wait_seconds" -lt 60 ]; then
            wait_seconds=60
          fi
          if [ "$wait_seconds" -gt 900 ]; then
            wait_seconds=900
          fi
          echo "Refresh work took ${elapsed}s. Scheduling the next cycle in ${wait_seconds}s."
          gh workflow run refresh-wake.yml --ref main -f delay_seconds="$wait_seconds"
