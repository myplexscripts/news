name: Refresh news

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'requirements.txt'
      - '.github/workflows/refresh.yml'
      - '.github/workflows/refresh-wake.yml'
      - '.github/workflows/enrich.yml'
  workflow_dispatch:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: refresh-news-v4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Record refresh cycle start
        shell: bash
        run: echo "CYCLE_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"

      - name: Decide whether refresh is due
        id: due
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          due = True
          try:
              payload = json.loads(Path("data/news.json").read_text(encoding="utf-8"))
              raw = str(payload.get("generated_at") or "").strip().replace("Z", "+00:00")
              generated = datetime.fromisoformat(raw)
              if generated.tzinfo is None:
                  generated = generated.replace(tzinfo=timezone.utc)
              age_minutes = (datetime.now(timezone.utc) - generated.astimezone(timezone.utc)).total_seconds() / 60
              due = age_minutes >= 20
              print(f"Published feed age: {age_minutes:.1f} minutes. Refresh due: {due}")
          except Exception as exc:
              print(f"Could not verify feed freshness, refreshing safely: {exc}")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"run={'true' if due else 'false'}\n")
          PY

      - name: Set up Python
        if: steps.due.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install collector dependencies
        if: steps.due.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Test collector safeguards
        if: steps.due.outputs.run == 'true'
        run: |
          python scripts/test_scoop_runtime.py
          python scripts/test_fast_scoop_budget.py
          python scripts/test_ctv_locality.py
          python scripts/test_publication_roundups.py
          python scripts/test_editorial.py
          python scripts/test_national_post_repair.py
          python scripts/test_source_content_repair.py
          python scripts/test_rich_articles.py
          python scripts/test_final_article_guard.py
          python scripts/test_article_tail_cleanup.py
          python scripts/test_refresh_merge.py
          python scripts/check_scope_contracts.py
          python scripts/check_local_source_rules.py

      - name: Fetch headline metadata
        if: steps.due.outputs.run == 'true'
        timeout-minutes: 15
        run: python scripts/run_fast_scoop.py

      - name: Apply fast feed normalization
        if: steps.due.outputs.run == 'true'
        run: |
          python scripts/repair_ctv_locality.py
          python scripts/annotate_scopes.py
          python scripts/apply_local_source_rules.py
          python scripts/filter_publication_roundups.py
          python scripts/repair_national_post_articles.py --filter-only
          python scripts/sanitize_article_blocks.py

      - name: Final article boundary guard
        if: steps.due.outputs.run == 'true'
        run: python scripts/trim_article_tails.py

      - name: Run cluster-aware audit
        if: steps.due.outputs.run == 'true'
        run: python scripts/run_audit.py

      - name: Commit fast refresh
        id: commit
        if: steps.due.outputs.run == 'true'
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- data/news.json data/audit.json public/cache/)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          rm -rf /tmp/scoop-fast-output
          mkdir -p /tmp/scoop-fast-output/cache
          cp data/news.json /tmp/scoop-fast-output/news.json
          cp data/audit.json /tmp/scoop-fast-output/audit.json
          rsync -a public/cache/ /tmp/scoop-fast-output/cache/

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$GITHUB_REF_NAME"
          git reset --hard "origin/$GITHUB_REF_NAME"

          # Headline collection may have started before a richer article pass
          # landed. Keep the fresh feed metadata while preserving whichever
          # article body is demonstrably more complete and media-rich.
          python scripts/merge_refresh_output.py \
            /tmp/scoop-fast-output/news.json \
            data/news.json \
            /tmp/news-merged.json
          mv /tmp/news-merged.json data/news.json
          python scripts/sanitize_article_blocks.py
          python scripts/trim_article_tails.py
          cp /tmp/scoop-fast-output/audit.json data/audit.json
          mkdir -p public/cache
          # Overlay cache additions from this refresh without deleting media
          # that a newer enrichment run may have committed concurrently.
          rsync -a /tmp/scoop-fast-output/cache/ public/cache/
          git add data/news.json data/audit.json public/cache/

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "Refresh news"
          git push origin "HEAD:$GITHUB_REF_NAME"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Deploy fast refresh
        if: steps.commit.outputs.changed == 'true' && github.ref_name == 'main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run site.yml --repo myplexscripts/news --ref main

      - name: Start deferred article enrichment
        if: steps.commit.outputs.changed == 'true' && github.ref_name == 'main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run enrich.yml --repo "$GITHUB_REPOSITORY" --ref main

      - name: Schedule next refresh
        if: always() && github.ref_name == 'main' && (github.event_name != 'schedule' || steps.due.outputs.run == 'true')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          now=$(date +%s)
          elapsed=$((now - CYCLE_START_EPOCH))
          wait_seconds=$((900 - elapsed))
          if [ "$wait_seconds" -lt 60 ]; then wait_seconds=60; fi
          if [ "$wait_seconds" -gt 900 ]; then wait_seconds=900; fi
          gh workflow run refresh-wake.yml --ref main -f delay_seconds="$wait_seconds"
