name: App browser checks
on:
  push:
    branches: [main, polish/app-health, polish/story-aggregation]
    paths:
      - 'src/**'
      - 'public/*.css'
      - 'public/sw.js'
      - 'package*.json'
      - 'tests/**'
      - 'playwright.config.js'
      - 'scripts/prepare_frontend.py'
      - 'scripts/prepare_service_worker.py'
      - 'svelte.config.js'
      - 'vite.config.js'
      - '.github/workflows/browser-tests.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'public/*.css'
      - 'public/sw.js'
      - 'package*.json'
      - 'tests/**'
      - 'playwright.config.js'
      - 'scripts/prepare_frontend.py'
      - 'scripts/prepare_service_worker.py'
      - 'svelte.config.js'
      - 'vite.config.js'
permissions:
  contents: read
concurrency:
  group: app-browser-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_PATH: /news
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python scripts/test_editorial.py && python scripts/test_fast_scoop_budget.py && python scripts/test_scoop_runtime.py
      - run: npm ci
      - run: npm run check
      - run: npm run test:app
      - run: npm run build
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium webkit
        timeout-minutes: 5
      - run: npm run test:browser
      - name: Save browser report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-browser-report
          path: |
            playwright-report
            test-results
          retention-days: 7
