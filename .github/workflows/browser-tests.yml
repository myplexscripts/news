name: App browser checks
on:
  push:
    branches: [main, polish/app-health]
    paths:
      - 'src/**'
      - 'public/*.css'
      - 'public/sw.js'
      - 'package*.json'
      - 'tests/**'
      - 'playwright.config.js'
      - '.github/workflows/browser-tests.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'public/*.css'
      - 'public/sw.js'
      - 'package*.json'
      - 'tests/**'
      - 'playwright.config.js'
permissions:
  contents: read
concurrency:
  group: app-browser-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    env:
      BASE_PATH: /news
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run check
      - run: npm run test:app
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:browser
      - name: Save browser report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-browser-report
          path: |
            playwright-report
            test-results
          retention-days: 7
