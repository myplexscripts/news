name: Finish consistency refactor

on:
  push:
    paths:
      - '.github/workflows/consistency-finish.yml'

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply canonical UI rules
        run: |
          python - <<'PY'
          from pathlib import Path

          home = Path('src/pages/index.astro')
          text = home.read_text(encoding='utf-8')
          marker = "const base = import.meta.env.BASE_URL;\n"
          helper = "const categoryClass = (category = 'Local') => `category-${category.toLowerCase().replace(/[^a-z0-9]+/g, '-')}`;\n"
          if helper not in text:
              if marker not in text:
                  raise SystemExit('home base marker missing')
              text = text.replace(marker, marker + helper, 1)
          home.write_text(text, encoding='utf-8')
          PY

          cat > public/smart-features.css <<'CSS'
          @import url("./card-refinements.css");
          @import url("./layout-fixes.css");

          /* Shared story cards are the only story-card system. */
          .news-card[hidden] {
            display: none !important;
          }

          .news-card-coverage {
            display: none !important;
          }

          .search-results .news-card,
          .related-grid .news-card {
            width: 100%;
            min-width: 0;
          }

          /* Shared page-heading component. */
          .page-heading {
            width: 100%;
            margin: 0 0 24px;
            padding: 0;
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 20px;
          }

          .page-heading-copy {
            min-width: 0;
          }

          .page-heading .masthead-label {
            margin: 0 0 6px;
            font-size: 16px;
            line-height: 1.1;
            font-weight: 700;
            color: var(--accent);
          }

          .page-heading h1 {
            margin: 0;
            font-size: 42px;
            line-height: 1;
            font-weight: 800;
            letter-spacing: -0.04em;
          }

          .page-heading-description {
            max-width: 680px;
            margin: 9px 0 0;
            color: var(--muted);
            font-size: 16px;
            line-height: 1.4;
            font-weight: 500;
          }

          .page-heading-actions {
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            gap: 12px;
          }

          @media (max-width: 760px) {
            .search-results,
            .related-grid {
              display: grid !important;
              grid-template-columns: minmax(0, 1fr) !important;
              gap: 16px !important;
            }

            .page-heading {
              display: block !important;
              margin-bottom: 14px !important;
            }

            .page-heading .masthead-label {
              margin-bottom: 5px !important;
            }

            .page-heading h1 {
              font-size: 36px !important;
              line-height: 1 !important;
              font-weight: 800 !important;
              letter-spacing: -0.04em !important;
            }

            .page-heading-description {
              margin-top: 7px !important;
              font-size: 16px !important;
              line-height: 1.4 !important;
            }

            .page-heading-actions {
              margin-top: 12px !important;
              justify-content: flex-start !important;
            }
          }

          @media (max-width: 390px) {
            .page-heading h1 {
              font-size: 34px !important;
            }
          }
          CSS

          cat > public/layout-fixes.css <<'CSS'
          /* Canonical mobile layout. This file is the final authority for shared headers and spacing. */
          @media (max-width: 760px) {
            html body .site-header .header-inner {
              padding-top: 14px !important;
              padding-bottom: 10px !important;
              align-items: end !important;
            }

            html body .site-header .brand {
              min-height: 0 !important;
              font-size: 30px !important;
              font-weight: 800 !important;
              line-height: 0.98 !important;
              letter-spacing: -0.045em !important;
            }

            html body .site-header.site-header-home .home-header-inner {
              display: grid !important;
              grid-template-columns: minmax(0, 1fr) auto !important;
              grid-template-rows: auto auto !important;
              column-gap: 14px !important;
              row-gap: 0 !important;
              align-items: end !important;
              padding-top: 14px !important;
              padding-bottom: 10px !important;
            }

            html body .site-header.site-header-home .brand-area {
              grid-column: 1 !important;
              grid-row: 1 !important;
              align-self: end !important;
            }

            html body .site-header.site-header-home .header-actions {
              display: none !important;
            }

            html body .site-header.site-header-home .home-meta-row {
              display: contents !important;
            }

            html body .site-header.site-header-home .home-header-updated {
              grid-column: 2 !important;
              grid-row: 1 !important;
              align-self: end !important;
              justify-self: end !important;
              min-height: 0 !important;
              margin: 0 0 1px !important;
              font-size: 16px !important;
              line-height: 1 !important;
              font-weight: 700 !important;
              white-space: nowrap !important;
            }

            html body .site-header.site-header-home .home-header-date {
              grid-column: 1 / -1 !important;
              grid-row: 2 !important;
              margin: 1px 0 0 !important;
              color: var(--muted) !important;
              font-size: 30px !important;
              font-weight: 800 !important;
              line-height: 0.98 !important;
              letter-spacing: -0.045em !important;
            }

            html body .site-header:not(.site-header-home) .header-inner {
              min-height: 0 !important;
            }

            html body .directory-page,
            html body .sections-page,
            html body .sources-page,
            html body .settings-page,
            html body .latest-page {
              margin-top: 0 !important;
              padding-top: 0 !important;
            }

            html body .directory-shell,
            html body .sections-shell,
            html body .sources-shell,
            html body .settings-shell,
            html body .latest-page-heading {
              padding-top: 8px !important;
            }

            html body .latest-page-heading {
              padding-bottom: 0 !important;
            }

            html body .sources-heading-actions {
              margin: 0 !important;
              padding: 0 !important;
            }

            html body .settings-groups {
              margin-top: 18px !important;
            }

            html body .article-page .article-shell-refined {
              padding-top: 6px !important;
            }

            html body .article-page .article-layout-refined,
            html body .article-page .article-header-refined {
              margin-top: 0 !important;
              padding-top: 0 !important;
            }

            html body .article-page .article-header-refined h1 {
              margin-top: 0 !important;
            }

            html body .story-date-heading h2,
            html body .editorial-section-heading h2 {
              font-size: 30px !important;
              font-weight: 800 !important;
              line-height: 1.05 !important;
              letter-spacing: -0.035em !important;
            }

            html body .settings-group h2 {
              font-size: 18px !important;
              line-height: 1.2 !important;
            }
          }

          @media (max-width: 390px) {
            html body .site-header .brand,
            html body .site-header.site-header-home .home-header-date {
              font-size: 28px !important;
            }

            html body .site-header.site-header-home .home-header-updated {
              font-size: 15px !important;
            }
          }
          CSS
      - name: Validate production build
        run: |
          npm ci
          npm run build
      - name: Commit validated consistency system
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/index.astro public/smart-features.css public/layout-fixes.css
          git rm -f .github/workflows/consistency-refactor.yml .github/workflows/consistency-finish.yml
          git commit -m "Enforce one shared UI system across pages"
          git push origin main
