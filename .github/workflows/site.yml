name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Resolve Pages base path
        shell: bash
        run: |
          REPO="${GITHUB_REPOSITORY#*/}"
          OWNER="${GITHUB_REPOSITORY%/*}"
          if [ "$REPO" = "$OWNER.github.io" ]; then
            echo "BASE_PATH=/" >> "$GITHUB_ENV"
          else
            echo "BASE_PATH=/$REPO" >> "$GITHUB_ENV"
          fi

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check UI design contracts
        run: python scripts/check_ui_contracts.py

      - name: Check story scope contracts
        run: python scripts/check_scope_contracts.py

      - name: Check confirmed London source contracts
        run: python scripts/check_local_source_rules.py

      - name: Install site dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Report dependency audit
        run: npm audit --json > npm-audit.json || true

      - name: Publish source logos
        shell: bash
        run: |
          mkdir -p public/images/logos
          cp -a images/logos/. public/images/logos/

      - name: Publish feed data and search index
        shell: bash
        run: |
          python scripts/annotate_scopes.py
          python scripts/apply_local_source_rules.py
          mkdir -p public/data
          cp data/news.json public/data/news.json
          cp data/audit.json public/data/audit.json
          python scripts/build_search_index.py

      - name: Build static site
        run: npm run build

      - name: Apply global UI guidelines
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          base = os.environ.get("BASE_PATH", "/").rstrip("/")
          ui_href = f"{base}/ui-guidelines.css" if base else "/ui-guidelines.css"
          interaction_href = f"{base}/interaction-cleanup.css" if base else "/interaction-cleanup.css"
          navigation_href = f"{base}/navigation-transitions.css" if base else "/navigation-transitions.css"
          links = (
              f'<link rel="stylesheet" href="{ui_href}" data-ui-system="guidelines">'
              f'<link rel="stylesheet" href="{interaction_href}" data-ui-system="interaction-cleanup">'
              f'<link rel="stylesheet" href="{navigation_href}" data-ui-system="navigation-transitions">'
          )

          updated = 0
          for path in Path("dist").rglob("*.html"):
              text = path.read_text(encoding="utf-8")
              if 'data-ui-system="guidelines"' in text or "</head>" not in text:
                  continue
              text = text.replace("</head>", f"{links}</head>", 1)
              path.write_text(text, encoding="utf-8")
              updated += 1

          print(f"Applied UI guidelines, interaction cleanup, and navigation transitions to {updated} page(s)")
          PY

      - name: Stamp deploy version
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          run_number = int(os.environ.get("GITHUB_RUN_NUMBER", "0"))
          version = f"v{run_number:03d}"
          marker = f'<span class="site-footer-version">update {version}</span>'

          updated = 0
          for path in Path("dist").rglob("*.html"):
              text = path.read_text(encoding="utf-8")
              if "site-footer-version" in text or "</footer>" not in text:
                  continue
              text = text.replace("</footer>", f"{marker}</footer>", 1)
              path.write_text(text, encoding="utf-8")
              updated += 1

          print(f"Stamped update {version} into {updated} page(s)")
          PY

      - name: Upload dependency audit
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: npm-audit.json
          retention-days: 7

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Persist generated lockfile
        if: github.event_name == 'push' && github.ref_name == 'main'
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- package-lock.json)" ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Lock npm dependencies"
          git pull --rebase origin main
          git push origin HEAD:main

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
