name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Resolve Pages base path
        shell: bash
        run: |
          REPO="${GITHUB_REPOSITORY#*/}"
          OWNER="${GITHUB_REPOSITORY%/*}"
          if [ "$REPO" = "$OWNER.github.io" ]; then
            echo "BASE_PATH=/" >> "$GITHUB_ENV"
          else
            echo "BASE_PATH=/$REPO" >> "$GITHUB_ENV"
          fi

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check UI design contracts
        run: python scripts/check_ui_contracts.py

      - name: Check story scope contracts
        run: python scripts/check_scope_contracts.py

      - name: Check confirmed London source contracts
        run: python scripts/check_local_source_rules.py

      - name: Check homepage feed contracts
        run: python scripts/check_home_feed_contracts.py

      - name: Check card image contract
        run: python scripts/test_card_image_contract.py

      - name: Install site dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Report dependency audit
        run: npm audit --json > npm-audit.json || true

      - name: Publish site images
        shell: bash
        run: |
          mkdir -p public/images/logos
          cp -a images/logos/. public/images/logos/
          cp images/social.png public/social.png

      - name: Publish feed data and search index
        shell: bash
        run: |
          python scripts/annotate_scopes.py
          python scripts/apply_local_source_rules.py
          # Card thumbnails are derived from the canonical article hero. Repair
          # stale references at deploy time too, so a queued refresh can never
          # publish an old author headshot after that hero was rejected.
          python scripts/repair_card_image_refs.py
          mkdir -p public/data
          cp data/news.json public/data/news.json
          cp data/audit.json public/data/audit.json
          python scripts/build_search_index.py

      - name: Build static site
        run: npm run build

      - name: Inject social metadata
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          owner = os.environ.get("GITHUB_REPOSITORY", "myplexscripts/news").split("/", 1)[0]
          base = os.environ.get("BASE_PATH", "/").rstrip("/")
          origin = f"https://{owner}.github.io"
          image_url = f"{origin}{base}/social.png" if base else f"{origin}/social.png"
          site_title = "Forest City News"
          description = "Local reporting from across London, Ontario."

          def page_url(path: Path) -> str:
              rel = path.relative_to("dist").as_posix()
              if rel == "index.html":
                  suffix = "/"
              elif rel.endswith("/index.html"):
                  suffix = "/" + rel[:-10]
              else:
                  suffix = "/" + rel
              prefix = base if base else ""
              return f"{origin}{prefix}{suffix}"

          tags_template = '''
          <meta property="og:site_name" content="{title}">
          <meta property="og:type" content="website">
          <meta property="og:locale" content="en_CA">
          <meta property="og:title" content="{title}">
          <meta property="og:description" content="{description}">
          <meta property="og:url" content="{url}">
          <meta property="og:image" content="{image}">
          <meta property="og:image:secure_url" content="{image}">
          <meta property="og:image:type" content="image/png">
          <meta property="og:image:width" content="1536">
          <meta property="og:image:height" content="1024">
          <meta property="og:image:alt" content="Forest City News social image">
          <meta name="twitter:card" content="summary_large_image">
          <meta name="twitter:title" content="{title}">
          <meta name="twitter:description" content="{description}">
          <meta name="twitter:image" content="{image}">
          <meta name="twitter:image:alt" content="Forest City News social image">
          '''

          updated = 0
          for path in Path("dist").rglob("*.html"):
              text = path.read_text(encoding="utf-8")
              if 'property="og:image"' in text or "</head>" not in text:
                  continue
              tags = tags_template.format(
                  title=site_title,
                  description=description,
                  url=page_url(path),
                  image=image_url,
              )
              text = text.replace("</head>", f"{tags}</head>", 1)
              path.write_text(text, encoding="utf-8")
              updated += 1

          print(f"Injected social metadata into {updated} page(s) using {image_url}")
          PY

      - name: Apply global UI guidelines
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          base = os.environ.get("BASE_PATH", "/").rstrip("/")
          ui_href = f"{base}/ui-guidelines.css" if base else "/ui-guidelines.css"
          interaction_href = f"{base}/interaction-cleanup.css" if base else "/interaction-cleanup.css"
          navigation_href = f"{base}/navigation-transitions.css" if base else "/navigation-transitions.css"
          links = (
              f'<link rel="stylesheet" href="{ui_href}" data-ui-system="guidelines">'
              f'<link rel="stylesheet" href="{interaction_href}" data-ui-system="interaction-cleanup">'
              f'<link rel="stylesheet" href="{navigation_href}" data-ui-system="navigation-transitions">'
          )

          updated = 0
          for path in Path("dist").rglob("*.html"):
              text = path.read_text(encoding="utf-8")
              if 'data-ui-system="guidelines"' in text or "</head>" not in text:
                  continue
              text = text.replace("</head>", f"{links}</head>", 1)
              path.write_text(text, encoding="utf-8")
              updated += 1

          print(f"Applied UI guidelines, interaction cleanup, and navigation transitions to {updated} page(s)")
          PY

      - name: Stamp deploy version
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          run_number = int(os.environ.get("GITHUB_RUN_NUMBER", "0"))
          version = f"v{run_number:03d}"
          marker = f'<span class="site-footer-version">update {version}</span>'

          updated = 0
          for path in Path("dist").rglob("*.html"):
              text = path.read_text(encoding="utf-8")
              if "site-footer-version" in text or "</footer>" not in text:
                  continue
              text = text.replace("</footer>", f"{marker}</footer>", 1)
              path.write_text(text, encoding="utf-8")
              updated += 1

          print(f"Stamped update {version} into {updated} page(s)")
          PY

      - name: Upload dependency audit
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: npm-audit.json
          retention-days: 7

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Persist generated lockfile
        if: github.event_name == 'push' && github.ref_name == 'main'
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- package-lock.json)" ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Lock npm dependencies"
          git pull --rebase origin main
          git push origin HEAD:main

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
