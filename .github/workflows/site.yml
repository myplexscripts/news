name: Refresh and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '7,37 * * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install collector dependencies
        run: pip install -r requirements.txt

      - name: Fetch local news
        run: python scripts/fetch_news.py

      - name: Run Scoop regression tests
        run: python scripts/test_scraper_regressions.py

      - name: Run audit rule tests
        run: python scripts/test_audit.py

      - name: Audit current Scoop output
        run: python scripts/audit_sources.py --sample-per-source 10

      - name: Upload Scoop audit report
        uses: actions/upload-artifact@v4
        with:
          name: scoop-audit-report
          path: data/audit.json
          retention-days: 14

      - name: Keep refreshed history in repository
        if: github.event_name != 'push'
        continue-on-error: true
        run: |
          if [ -z "$(git status --porcelain -- data/news.json data/audit.json public/cache/)" ]; then
            echo "No data changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json data/audit.json public/cache/
          git commit -m "Refresh local news"
          git push

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Resolve Pages base path
        shell: bash
        run: |
          REPO="${GITHUB_REPOSITORY#*/}"
          OWNER="${GITHUB_REPOSITORY%/*}"
          if [ "$REPO" = "$OWNER.github.io" ]; then
            echo "BASE_PATH=/" >> "$GITHUB_ENV"
          else
            echo "BASE_PATH=/$REPO" >> "$GITHUB_ENV"
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install site dependencies
        run: npm install

      - name: Publish source logos
        shell: bash
        run: |
          mkdir -p public/images/logos
          cp -a images/logos/. public/images/logos/

      - name: Build static site
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
