name: Enrich news articles

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/enrich_tweets.py'
      - 'scripts/test_tweet_media.py'
      - '.github/workflows/enrich.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: enrich-news-v2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install collector dependencies
        run: pip install -r requirements.txt

      - name: Test article enrichment pipeline
        run: |
          python scripts/test_article_formatting.py
          python scripts/test_article_media.py
          python scripts/test_tweet_media.py
          python scripts/test_rich_articles.py
          python scripts/test_source_profiles.py
          python scripts/test_article_sanitizer.py
          python scripts/test_reader_mode_articles.py
          python scripts/test_recirculation_cleanup.py
          python scripts/test_article_tail_cleanup.py
          python scripts/test_publisher_hygiene.py
          python scripts/test_article_contract.py
          python scripts/test_card_image_contract.py
          python scripts/test_cbc_lite_hero_repair.py
          python scripts/test_national_post_repair.py
          python scripts/test_source_content_repair.py
          python scripts/test_ctv_photo_repair.py
          python scripts/check_scope_contracts.py
          python scripts/check_local_source_rules.py

      - name: Enrich pending article bodies
        run: python scripts/enrich_pending.py --limit 60

      - name: Repair National Post article bodies
        timeout-minutes: 6
        run: python scripts/repair_national_post_articles.py --limit 30

      - name: Refine enriched articles
        run: |
          python scripts/fix_cbc_fallback.py
          python scripts/repair_source_content.py --cbc-limit 40
          python scripts/hydrate_cbc_lite.py
          python scripts/enrich_article_structure.py
          python scripts/refine_article_formatting.py
          python scripts/reader_mode_articles.py
          python scripts/enrich_article_media.py
          python scripts/enrich_rich_articles.py --limit 64
          # Publisher profiles run after generic readers so a broad Readability or
          # Trafilatura result cannot overwrite a cleaner publisher article root.
          python scripts/refine_source_articles.py
          # Tweet enrichment runs after all body replacement passes so native tweet
          # blocks cannot be overwritten by a later generic article extraction.
          python scripts/enrich_tweets.py --limit 60
          python scripts/cleanup_article_recirculation.py
          python scripts/publisher_hygiene.py
          python scripts/sanitize_article_blocks.py
          python scripts/trim_article_tails.py
          python scripts/repair_source_content.py --cbc-limit 0
          python scripts/repair_ctv_photos.py --limit 80
          python scripts/repair_cbc_images.py
          python scripts/repair_cbc_lite_heroes.py
          python scripts/enforce_article_contract.py
          python scripts/repair_card_image_refs.py

      - name: Run regression and audit tests
        run: |
          python scripts/test_scraper_regressions.py
          python scripts/test_audit.py
          python scripts/test_run_audit.py
          python scripts/run_audit.py --sample-per-source 10

      - name: Upload Scoop audit report
        uses: actions/upload-artifact@v4
        with:
          name: scoop-audit-report-${{ github.run_number }}
          path: data/audit.json
          retention-days: 14

      - name: Commit enriched articles
        id: commit
        timeout-minutes: 8
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- data/news.json data/audit.json public/cache/)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          rm -rf /tmp/scoop-enriched-output
          mkdir -p /tmp/scoop-enriched-output/cache
          cp data/news.json /tmp/scoop-enriched-output/news.json
          rsync -a public/cache/ /tmp/scoop-enriched-output/cache/

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # A refresh or code change can land during the long extraction phase.
          # Rebuild the enriched output on newest main before every push attempt.
          # Keep retries local: all network repair work already happened above.
          for attempt in 1 2 3 4; do
            echo "Preparing enrichment push attempt $attempt/4"
            git fetch origin "$GITHUB_REF_NAME"
            git reset --hard "origin/$GITHUB_REF_NAME"

            python scripts/merge_enriched_output.py \
              /tmp/scoop-enriched-output/news.json \
              data/news.json \
              /tmp/news-merged.json
            mv /tmp/news-merged.json data/news.json

            python scripts/apply_local_source_rules.py
            python scripts/publisher_hygiene.py
            python scripts/sanitize_article_blocks.py
            python scripts/trim_article_tails.py
            python scripts/enforce_article_contract.py
            python scripts/run_audit.py --sample-per-source 10

            mkdir -p public/cache
            # Overlay newly enriched media without deleting files from newer refreshes.
            rsync -a /tmp/scoop-enriched-output/cache/ public/cache/
            git add data/news.json data/audit.json public/cache/

            if git diff --cached --quiet; then
              echo "changed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            git commit -m "Enrich news articles"
            if git push origin "HEAD:$GITHUB_REF_NAME"; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "main moved during enrichment push attempt $attempt; rebuilding on newest main"
            sleep $((attempt * 2))
          done

          echo "Enrichment could not publish after 4 concurrent-push retries" >&2
          exit 1

      - name: Deploy enriched site
        if: steps.commit.outputs.changed == 'true' && github.ref_name == 'main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run site.yml --repo "$GITHUB_REPOSITORY" --ref main
