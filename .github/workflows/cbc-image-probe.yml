name: Validate CBC image repair

on:
  push:
    paths:
      - '.github/workflows/cbc-image-probe.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: pip install requests

      - name: Repair stale CBC image refs
        run: python scripts/repair_cbc_image_refs.py

      - name: Run CBC cache
        run: python scripts/cache_cbc_images.py

      - name: Verify noise complaint story image
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import urlparse

          payload=json.loads(Path('data/news.json').read_text(encoding='utf-8'))
          story=next(s for s in payload.get('stories',[]) if s.get('id')=='36b41022df70e1e7')
          image=str(story.get('image') or '')
          card=str(story.get('card_image') or '')
          print('IMAGE:', image)
          print('CARD:', card)
          print('CACHED:', story.get('cbc_images_cached'))
          print('HOTLINK:', story.get('cbc_image_hotlink'))
          assert image != 'cache/news/25cfa12eeb2e0e911177.webp'
          assert image, 'CBC story still has no hero image'
          if image.startswith(('http://','https://')):
              assert urlparse(image).netloc.lower() == 'i.cbc.ca', image
          else:
              local=image
              if local.startswith('/news/'):
                  local=local[len('/news/'):]
              local=local.lstrip('/')
              path=Path('public') / local
              print('LOCAL PATH:', path, 'exists=', path.exists(), 'size=', path.stat().st_size if path.exists() else 0)
              assert path.exists() and path.stat().st_size >= 1000
          PY
