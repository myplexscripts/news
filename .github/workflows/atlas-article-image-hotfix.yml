name: Apply article image hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/atlas-article-image-hotfix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}')
              target.write_text(text.replace(old, new, 1), encoding='utf-8')

          page = 'src/routes/story/[id]/+page.svelte'
          replace_once(
              page,
              '''            {#if story.image_caption}\n              <p class="article-cover-caption">{story.image_caption}</p>\n            {/if}\n\n            {#if showDeck}''',
              '''            {#if showDeck}''',
          )
          replace_once(
              page,
              '''            <div class="article-copy article-copy-refined">\n              {#if blocks.length === 0}''',
              '''            <div class="article-copy article-copy-refined">\n              {#if heroImage}\n                <figure class="inline-article-image article-editorial-image">\n                  <img\n                    src={heroImage}\n                    srcset={heroSrcset || undefined}\n                    sizes="(max-width: 800px) 100vw, 760px"\n                    data-original-src={coverCandidate.original_url || story.original_image}\n                    on:error={originalImageFallback}\n                    on:load={checkArticleImage}\n                    alt={story.image_alt || ''}\n                    loading="lazy"\n                    decoding="async"\n                    referrerpolicy="no-referrer"\n                  />\n                  {#if story.image_caption}<figcaption>{story.image_caption}</figcaption>{/if}\n                </figure>\n              {/if}\n\n              {#if blocks.length === 0}''',
          )

          ctv = 'scripts/repair_ctv_photos_v2.py'
          replace_once(ctv, 'CTV_PHOTO_SCHEMA = 3', 'CTV_PHOTO_SCHEMA = 4')
          replace_once(
              ctv,
              '''    if int(story.get("ctv_photo_schema") or 0) < CTV_PHOTO_SCHEMA:\n        return True\n    scraped = str(story.get("scraped_at") or "").strip()''',
              '''    if int(story.get("ctv_photo_schema") or 0) < CTV_PHOTO_SCHEMA:\n        return True\n    # A previous failed recovery must never make an image-less CTV story look current.\n    if int(story.get("ctv_photo_count") or 0) <= 0:\n        return True\n    scraped = str(story.get("scraped_at") or "").strip()''',
          )

          reader = 'scripts/reader_mode_articles.py'
          replace_once(
              reader,
              'WORKERS = max(2, min(12, int(os.getenv("READER_WORKERS", "10"))))',
              '# Native HTML parser stacks are not reliably thread-safe together in CI.\nWORKERS = max(1, min(12, int(os.getenv("READER_WORKERS", "1"))))',
          )

          test = 'scripts/test_ctv_photo_repair_v2.py'
          replace_once(
              test,
              '''def test_schema_three_rechecks_polluted_schema_two_story() -> None:\n    story = {\n        "source": "CTV News Canada",\n        "url": "https://www.ctvnews.ca/canada/article/example",\n        "ctv_photo_schema": 2,\n        "scraped_at": "2026-09-13T22:00:00+00:00",\n        "ctv_photo_checked_for_scrape": "2026-09-13T22:00:00+00:00",\n    }\n    assert photos.CTV_PHOTO_SCHEMA == 3\n    assert photos.story_needs_work(story)\n''',
              '''def test_schema_four_rechecks_old_and_image_less_stories() -> None:\n    old_story = {\n        "source": "CTV News Canada",\n        "url": "https://www.ctvnews.ca/canada/article/example",\n        "ctv_photo_schema": 3,\n        "ctv_photo_count": 2,\n        "scraped_at": "2026-09-13T22:00:00+00:00",\n        "ctv_photo_checked_for_scrape": "2026-09-13T22:00:00+00:00",\n    }\n    image_less_story = {\n        "source": "CTV News",\n        "url": "https://www.ctvnews.ca/london/article/example",\n        "ctv_photo_schema": 4,\n        "ctv_photo_count": 0,\n        "scraped_at": "2026-09-13T22:00:00+00:00",\n        "ctv_photo_checked_for_scrape": "2026-09-13T22:00:00+00:00",\n    }\n    assert photos.CTV_PHOTO_SCHEMA == 4\n    assert photos.story_needs_work(old_story)\n    assert photos.story_needs_work(image_less_story)\n''',
          )
          replace_once(
              test,
              '''    test_schema_three_rechecks_polluted_schema_two_story()\n    print("PASS test_schema_three_rechecks_polluted_schema_two_story")''',
              '''    test_schema_four_rechecks_old_and_image_less_stories()\n    print("PASS test_schema_four_rechecks_old_and_image_less_stories")''',
          )
          PY

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Verify scraper fixes
        run: |
          python -m py_compile scripts/reader_mode_articles.py scripts/repair_ctv_photos_v2.py
          python scripts/test_ctv_photo_repair_v2.py
          python scripts/test_reader_mode_articles.py

      - name: Verify frontend build
        run: |
          npm ci
          npm run build

      - name: Commit fixes and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/atlas-article-image-hotfix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix article and CTV image handling"
          git push origin HEAD:main
