name: Probe CBC body routes

on:
  push:
    paths:
      - '.github/workflows/cbc-probe.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe current CBC stories
        shell: bash
        run: |
          set +e

          probe() {
            label="$1"
            story_id="$2"
            headline="$3"
            file="/tmp/${label}.txt"
            result=$(curl -L --connect-timeout 4 --max-time 20 -sS -o "$file" -w '%{http_code} %{size_download}' "https://r.jina.ai/http://www.cbc.ca/lite/story/${story_id}" 2>&1)
            words=$(wc -w < "$file" 2>/dev/null || echo 0)
            if grep -Fqi "$headline" "$file" 2>/dev/null; then found=yes; else found=no; fi
            marker=$(grep -ci '^Markdown Content:' "$file" 2>/dev/null || echo 0)
            echo "$label: curl=$result words=$words headline=$found markdown_marker=$marker"
          }

          probe short 9.7322721 'Missing swimmer found dead at Pinery Provincial Park'
          probe mayor 9.7321257 "London's youngest mayoral candidate aims to reach voters through viral videos and social media"
          probe airport 9.7321451 'airport adds Porter Airlines'
          probe obstetrics 9.7319650 'obstetrics'
