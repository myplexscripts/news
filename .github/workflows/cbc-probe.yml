name: Probe CBC image routes

on:
  push:
    paths:
      - '.github/workflows/cbc-probe.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe CBC image URLs through Jina Reader
        shell: bash
        run: |
          set +e
          story_id='9.7321257'
          slug='london-s-youngest-mayoral-candidate-aims-to-reach-voters-through-viral-videos-and-social-media-9.7321257'

          probe() {
            label="$1"
            target="$2"
            file="/tmp/${label}.txt"
            result=$(curl -L --connect-timeout 4 --max-time 25 -sS \
              -H 'X-Retain-Images: all' \
              -H 'X-With-Images-Summary: all' \
              -o "$file" -w '%{http_code} %{size_download}' \
              "https://r.jina.ai/http://${target}" 2>&1)
            image_count=$(grep -Eo '!\[[^]]*\]\(https?://[^)]+\)' "$file" 2>/dev/null | wc -l | tr -d ' ')
            echo "$label: curl=$result image_count=$image_count"
            grep -Eo '!\[[^]]*\]\(https?://[^)]+\)' "$file" 2>/dev/null | head -n 8 || true
          }

          probe lite "www.cbc.ca/lite/story/${story_id}"
          probe full "www.cbc.ca/news/canada/london/${slug}"
