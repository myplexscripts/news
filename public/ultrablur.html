<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0a0a0a"><title>Ultrablur Comparisons</title><style>
:root{color-scheme:dark;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0a0a0a;color:#f5f5f7}*{box-sizing:border-box}html{background:#0a0a0a}body{margin:0;min-height:100vh;background:radial-gradient(circle at 20% 0%,rgba(255,255,255,.07),transparent 34rem),#0a0a0a}.page{width:min(1180px,calc(100% - 32px));margin:auto;padding:max(44px,env(safe-area-inset-top)) 0 max(72px,env(safe-area-inset-bottom))}header{max-width:760px;margin-bottom:38px}.eyebrow{margin:0 0 10px;color:#a1a1aa;font-size:.78rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase}h1{margin:0;font-size:clamp(2.4rem,7vw,5.4rem);line-height:.95;letter-spacing:-.055em}.intro{max-width:620px;margin:20px 0 0;color:#a1a1aa;font-size:clamp(1rem,2vw,1.18rem);line-height:1.55}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:34px 24px}.case{min-width:0}.compare{--split:50%;--pair:none;position:relative;width:100%;aspect-ratio:709/1536;overflow:hidden;border:1px solid rgba(255,255,255,.13);border-radius:24px;background:#18181b;box-shadow:0 18px 55px rgba(0,0,0,.28);isolation:isolate;touch-action:pan-y}.shot{position:absolute;inset:0;background-image:var(--pair);background-repeat:no-repeat;background-size:200% 100%}.before{background-position:left}.after{background-position:right;clip-path:inset(0 0 0 var(--split))}.tag{position:absolute;top:12px;z-index:3;padding:7px 10px;border:1px solid rgba(255,255,255,.18);border-radius:999px;background:rgba(0,0,0,.58);color:#fff;font-size:.72rem;font-weight:700;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);pointer-events:none}.before-tag{left:12px}.after-tag{right:12px}.divider{position:absolute;inset:0 auto 0 var(--split);z-index:4;width:2px;background:rgba(255,255,255,.92);transform:translateX(-1px);pointer-events:none}.handle{position:absolute;top:50%;left:50%;display:grid;place-items:center;width:44px;height:44px;border:2px solid rgba(255,255,255,.92);border-radius:50%;background:rgba(12,12,12,.64);transform:translate(-50%,-50%);box-shadow:0 5px 18px rgba(0,0,0,.3);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}.handle:before{content:"‹  ›";font-size:1.15rem;font-weight:800;letter-spacing:.15em;transform:translateX(.08em)}.range{position:absolute;inset:0;z-index:5;width:100%;height:100%;margin:0;opacity:0;cursor:ew-resize}.compare:focus-within{outline:3px solid rgba(255,255,255,.85);outline-offset:4px}.case h2{margin:14px 2px 0;font-size:.98rem;line-height:1.3}.case p{margin:4px 2px 0;color:#71717a;font-size:.8rem}.hint{margin:36px 0 0;color:#71717a;font-size:.82rem;line-height:1.5}@media(max-width:820px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:520px){.page{width:min(100% - 28px,420px);padding-top:34px}header{margin-bottom:28px}.grid{grid-template-columns:1fr;gap:30px}.compare{border-radius:22px}}
</style></head><body><main class="page"><header><p class="eyebrow">Image comparison</p><h1>Ultrablur</h1><p class="intro">Drag across each screenshot to compare the original App Store version with the updated TestFlight version.</p></header><section class="grid" id="grid" aria-label="Before and after comparisons"></section><p class="hint">Before is on the left. After is on the right. Drag the divider or use the arrow keys.</p></main><script>
const items=[["Miscommunication","Timbaland, Keri Hilson, Sebastian"],["Brazil","Iggy Azalea"],["Sade In The 90s","Qveen Herby"],[".FEISTY","Fred again.."],["Young","Sam Smith"],["Won't Let You Down","Maya Jane Coles"],["Old Friend","Elderbrook"],["Slow Song","The Knocks, Dragonette"],["Glamorous","Fergie, Ludacris"]];
const grid=document.querySelector('#grid');items.forEach(([title,artist],i)=>{const n=String(i+1).padStart(2,'0'),card=document.createElement('article');card.className='case';card.innerHTML=`<div class="compare" style="--pair:url('./ultrablur-assets/pair-${n}.svg')"><div class="shot before"></div><div class="shot after"></div><span class="tag before-tag">Before</span><span class="tag after-tag">After</span><div class="divider"><span class="handle"></span></div><input class="range" type="range" min="0" max="100" value="50" aria-label="Compare ${title} before and after"></div><h2>${title}</h2><p>${artist}</p>`;grid.append(card)});
document.querySelectorAll('.compare').forEach(c=>{const r=c.querySelector('.range'),set=v=>{v=Math.max(0,Math.min(100,Number(v)));c.style.setProperty('--split',v+'%');r.value=v};r.addEventListener('input',()=>set(r.value));c.addEventListener('pointerdown',e=>{if(e.pointerType==='touch')return;const b=c.getBoundingClientRect();set((e.clientX-b.left)/b.width*100)})});
</script></body></html>
