<!doctype html>
<html lang="en-CA" data-theme="light" data-accent="green" data-hide-read="false">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#050505" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Forest City News" />
    <script>
      (() => {
        try {
          const root = document.documentElement;
          const standalone =
            window.navigator.standalone === true
            || window.matchMedia?.('(display-mode: standalone)').matches === true;
          if (!standalone) return;

          root.classList.add('standalone-webapp');
          root.classList.toggle('story-route', /\/story\/[^/]+/.test(window.location.pathname));

          const probe = document.createElement('div');
          probe.style.cssText = 'position:fixed;top:0;left:0;width:0;height:env(safe-area-inset-top, 0px);visibility:hidden;pointer-events:none';
          root.appendChild(probe);
          const measured = Number.parseFloat(getComputedStyle(probe).height) || 0;
          probe.remove();

          const isiPhone = /iPhone|iPod/i.test(navigator.userAgent);
          const isiPad = /iPad/i.test(navigator.userAgent)
            || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
          const fallback = isiPhone ? 59 : isiPad ? 24 : 0;
          root.style.setProperty('--standalone-status-height', `${Math.round(measured > 0 ? measured : fallback)}px`);
        } catch {}
      })();
    </script>
    <link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
    <link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="%sveltekit.assets%/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="%sveltekit.assets%/icons/icon-180.png" />
    <link rel="stylesheet" href="%sveltekit.assets%/smart-features.css?v=20260908-5" />
    <link rel="stylesheet" href="%sveltekit.assets%/story-flow-fix.css?v=20260911-1" />
    <link rel="stylesheet" href="%sveltekit.assets%/ios-safe-area.css?v=20260908-1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css" />
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/duotone/style.css" />
    <script>
      (() => {
        try {
          const root = document.documentElement;
          const theme = localStorage.getItem('london-news-theme');
          const accent = localStorage.getItem('london-news-accent');
          const hideRead = localStorage.getItem('london-news-hide-read');
          if (theme === 'light' || theme === 'dark') root.dataset.theme = theme;
          else if (matchMedia('(prefers-color-scheme: dark)').matches) root.dataset.theme = 'dark';
          if (accent) root.dataset.accent = accent;
          root.dataset.hideRead = hideRead === 'true' ? 'true' : 'false';
        } catch {}
      })();
    </script>
    %sveltekit.head%
    <link rel="stylesheet" href="%sveltekit.assets%/mobile-nav-stable.css?v=20260914-1" />
    <script>
      (() => {
        if (window.__forestCityNavMotion) return;
        window.__forestCityNavMotion = true;

        const mobile = window.matchMedia('(max-width: 760px)');
        const indexes = Object.freeze({ home: 0, sections: 1, search: 2, settings: 3 });
        const transforms = Object.freeze([
          'translate3d(0%, 0, 0)',
          'translate3d(100%, 0, 0)',
          'translate3d(200%, 0, 0)',
          'translate3d(300%, 0, 0)'
        ]);

        let pendingIndex = null;
        let pendingTimer = 0;

        const getNav = () => document.querySelector('nav.mobile-tab-bar.svelte-mobile-tab-bar');

        const routeIndex = (pathname = window.location.pathname) => {
          const path = String(pathname).toLowerCase();
          if (/\/(sections|sources)(\/|$)/.test(path)) return 1;
          if (/\/search(\/|$)/.test(path)) return 2;
          if (/\/settings(\/|$)/.test(path)) return 3;
          return 0;
        };

        const setIndex = (index) => {
          const nav = getNav();
          if (!nav) return false;

          const safeIndex = Math.max(0, Math.min(3, Number(index) || 0));
          nav.dataset.activeIndex = String(safeIndex);

          if (mobile.matches) {
            nav.querySelector('.mobile-tab-indicator')?.style.setProperty('transform', transforms[safeIndex], 'important');
          }

          return true;
        };

        const syncRoute = (force = false) => {
          const actual = routeIndex();
          if (!force && pendingIndex !== null && actual !== pendingIndex) {
            setIndex(pendingIndex);
            return;
          }

          pendingIndex = null;
          window.clearTimeout(pendingTimer);
          pendingTimer = 0;
          setIndex(actual);
        };

        const previewTab = (event) => {
          if (!mobile.matches) return;
          const target = event.target instanceof Element ? event.target : null;
          const link = target?.closest('a.mobile-tab[data-mobile-tab]');
          if (!link) return;

          const index = indexes[link.dataset.mobileTab];
          if (index === undefined) return;

          pendingIndex = index;
          setIndex(index);
          window.clearTimeout(pendingTimer);
          pendingTimer = window.setTimeout(() => syncRoute(true), 1600);
        };

        const ensureNav = (attempt = 0) => {
          if (setIndex(pendingIndex ?? routeIndex())) return;
          if (attempt < 120) requestAnimationFrame(() => ensureNav(attempt + 1));
        };

        document.addEventListener('pointerdown', previewTab, { capture: true, passive: true });
        document.addEventListener('click', previewTab, { capture: true });
        window.addEventListener('popstate', () => queueMicrotask(() => syncRoute(true)));
        window.addEventListener('pageshow', () => queueMicrotask(() => syncRoute(true)));

        const originalPushState = history.pushState.bind(history);
        history.pushState = (...args) => {
          const result = originalPushState(...args);
          queueMicrotask(() => syncRoute());
          return result;
        };

        const originalReplaceState = history.replaceState.bind(history);
        history.replaceState = (...args) => {
          const result = originalReplaceState(...args);
          queueMicrotask(() => syncRoute());
          return result;
        };

        const handleViewportChange = () => {
          if (mobile.matches) setIndex(pendingIndex ?? routeIndex());
        };

        if (typeof mobile.addEventListener === 'function') {
          mobile.addEventListener('change', handleViewportChange);
        } else if (typeof mobile.addListener === 'function') {
          mobile.addListener(handleViewportChange);
        }

        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', () => ensureNav(), { once: true });
        } else {
          ensureNav();
        }
      })();
    </script>
  </head>
  <body data-sveltekit-preload-data="tap">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
